version: "3.9"

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: calendario-postgres
    environment:
      POSTGRES_DB: CalendarioLaboral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apiCalendarioLaboral/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CalendarioLaboral"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-db:
    image: mongo:7
    container_name: calendario-mongo
    environment:
      MONGO_INITDB_DATABASE: calendario_laboral
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./apiCalendarioLaboralExpress/mongodb/01-init-db.mongodb.js:/docker-entrypoint-initdb.d/01-init-db.js:ro
      - ./apiCalendarioLaboralExpress/mongodb/02-seed-data.mongodb.js:/docker-entrypoint-initdb.d/02-seed-data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  express-api:
    build:
      context: ./apiCalendarioLaboralExpress
      dockerfile: Dockerfile
    container_name: calendario-express
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo-db:27017/calendario_laboral
      JWT_SECRET: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      JWT_EXPIRES_IN: 30m
    depends_on:
      mongo-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-api:
    build:
      context: ./apiCalendarioLaboral
      dockerfile: Dockerfile
    container_name: calendario-spring
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/CalendarioLaboral
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      EXPRESS_API_BASE_URL: http://express-api:3000
      EXPRESS_API_USUARIO: frayosorio
      EXPRESS_API_CLAVE: 123
    depends_on:
      postgres-db:
        condition: service_healthy
      express-api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  mongo_data:
