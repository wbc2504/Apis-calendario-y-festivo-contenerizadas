version: "3.9"

services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CalendarioLaboral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CalendarioLaboral"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/CalendarioLaboral
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      EXPRESS_API_BASE_URL: http://host.docker.internal:3000
      EXPRESS_API_USUARIO: frayosorio
      EXPRESS_API_CLAVE: 123
    depends_on:
      postgres-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
